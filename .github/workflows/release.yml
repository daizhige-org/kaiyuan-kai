name: Release

# Builds kaiyuan-kai-sc.ttf straight from this repo's own content (build.py
# downloads its own upstream sources; nothing else in the repo is required)
# and publishes it as a GitHub Release.
#
# Trigger by pushing a tag: git tag v0.0.1 && git push origin v0.0.1
# (or run manually from the Actions tab for a dry-run build without a tag).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          file_version="$(cat VERSION)"
          if [ "$tag_version" != "$file_version" ]; then
            echo "::error::tag v$tag_version does not match VERSION file ($file_version)"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: pip install fonttools brotli pillow

      - name: Build from repo content (downloads upstream sources itself)
        run: python3 build.py

      - name: Package webfont bundle
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "${GITHUB_REF_NAME}" = "${version}" ] && version="0.0.0-dev"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          bundle="kaiyuan-kai-sc-webfont-${version}.zip"
          echo "BUNDLE=$bundle" >> "$GITHUB_ENV"
          zip -r "$bundle" kaiyuan-kai-sc.css fonts README.md LICENSE ARPHICPL.TXT

      - name: Upload build artifacts (every run, including manual dry-runs)
        uses: actions/upload-artifact@v4
        with:
          name: kaiyuan-kai-sc-${{ env.VERSION }}
          path: |
            kaiyuan-kai-sc.ttf
            ${{ env.BUNDLE }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            kaiyuan-kai-sc.ttf \
            "${BUNDLE}" \
            --title "开元楷体 / Kaiyuan Kai SC ${GITHUB_REF_NAME}" \
            --generate-notes
